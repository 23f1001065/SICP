<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="device-width, initial-scale=1">
        <title>Sponsor login</title>
        <link rel="stylesheet" href="..\static\login.css">
    </head>
    <body>
        <div style="height: 18.5cm;">
            <h1>Welcome back</h1>
            <hr>
            <p>Enter your sponsor id and password</p>
            
            <form action="/sponsor/login" method="POST">
                <label>Sponsor Email</label><br>
                <input type="text" name="sponsorEmail" placeholder="example@gmail.com" required><br>
                
                <label>Password</label><br>
                <input type="text" name="password" placeholder="Enter Password" required><br>
                
                <button type="submit">login</button>
                <p>Don't have an account? <a href="{{url_for('sponsor_register')}}">Register</a></p>
                <p>go back to <a href="{{url_for('home')}}">Home</a></p>
            </form>
        </div>
        
        <footer>
            @created with love, by poku-aku
        </footer>
    </body>
</html>
